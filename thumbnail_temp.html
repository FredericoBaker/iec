<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail - Igreja em Contagem</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --accent: #d4a373;
      --accent-2: #a97a55;
      --text-main: #1b1b1b;
      --text-secondary: #444;
      --border-color: #c9a57a;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 100%);
      font-family: 'Montserrat', sans-serif;
    }

    .thumbnail {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 1250px;
      height: 690px;
      overflow: hidden;
      background: var(--bg);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }

    .photo {
      position: absolute;
      top: 15px;
      right: 15px;
      width: calc(40% - 15px);
      height: calc(100% - 30px);
      object-fit: cover;
      object-position: center;
      filter: brightness(0.95);
      border-radius: 20px;
      z-index: 1;
    }

    .logo-section {
      position: absolute;
      top: 40px;
      left: 50px;
      z-index: 3;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.1));
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .brand small {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #6b6b6b;
      font-weight: 600;
    }

    .brand strong {
      font-size: 18px;
      color: var(--text-main);
      font-weight: 800;
      letter-spacing: .02em;
    }

    .text-section {
      position: absolute;
      top: 50%;
      left: 100px;
      transform: translateY(-50%);
      z-index: 4;
      max-width: 500px; /* Reduzi um pouco o max-width para garantir que textos longos não invadam a imagem */
    }

    .divider {
      width: 72px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 3px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 65px;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .date-badge {
      position: absolute;
      bottom: 45px;
      left: 50px;
      z-index: 4;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      padding: 10px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(212, 163, 115, 0.3);
    }

    .date-badge .date-value {
      font-size: 18px;
      color: #fff;
      font-weight: 500;
      letter-spacing: .01em;
    }

  </style>
</head>
<body>
  <div class="thumbnail">
    <img class="photo" src="file:///C:/Users/fredb/Desktop/Igreja/Youtube/scripts/thumbnails/thumbnail_hfEvH4QSrB8.png" alt="">
    
    <div class="logo-section">
      <img class="logo" src="C:\Users\fredb\Desktop\Igreja\Youtube\scripts\templates\logo.png" alt="Logo">
    </div>

    <div class="text-section">
      <div class="divider"></div>
      <h1>Tito: Submissão</h1>
      <p>Lincoln Baker</p>
    </div>

    <div class="date-badge">
      <div class="date-value">11/01/2026</div>
    </div>
  </div>
</body>
</html>
