<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .thumbnail {
      width: 1280px;
      height: 720px;
      background-color: #fdf6e6;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .logo {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 50px;
      height: 50px;
      z-index: 10;
      object-fit: contain;
    }

    .text-section {
      flex: 1;
      padding: 80px 60px;
      z-index: 5;
      max-width: 700px;
    }

    h1 {
      font-size: 82px;
      line-height: 0.95;
      margin: 0 0 30px;
      color: #1a1a1a;
      font-weight: 800;
      letter-spacing: -2px;
    }

    p {
      font-size: 28px;
      color: #555;
      margin: 0;
      font-weight: 500;
    }

    .image-frame {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 45%;
      height: 600px;
      background-color: #fff;
      border-radius: 30px 0 0 30px;
      overflow: hidden;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.1);
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <div class="thumbnail">
    <img class="logo" src="logo.png" alt="Logo">

    <div class="text-section">
      <h1>Qual é a Sua Pátria?</h1>
      <p>Samuel Baker</p>
    </div>

    <div class="image-frame">
      <img class="photo" src="../thumbnails/original_thumbnail_2025-10-26_Eb9cP2JFYRQ.jpg" alt="Samuel Baker" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #667eea 0%, #764ba2 100%)'">
    </div>
  </div>
</body>
</html>
