<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail - Igreja em Contagem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --accent: #d4a373;
      --accent-2: #a97a55;
      --text-main: #1b1b1b;
      --text-secondary: #444;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
    }

    .thumbnail {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: var(--bg);
    }


    .photo {
      position: absolute;
      top: 50%;
      left: 60%;
      transform: translate(-35%, -50%);
      width: 110%;
      height: 110%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.95);
      z-index: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(250,248,245,1) 0%,
        rgba(250,248,245,0.98) 25%,
        rgba(250,248,245,0.92) 35%,
        rgba(250,248,245,0.75) 50%,
        rgba(250,248,245,0.4) 65%,
        rgba(250,248,245,0.15) 78%,
        rgba(250,248,245,0) 90%
      );
      z-index: 2;
    }

    .logo-section {
      position: absolute;
      top: 40px;
      left: 50px;
      z-index: 3;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.1));
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .brand small {
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #6b6b6b;
      font-weight: 600;
    }

    .brand strong {
      font-size: 18px;
      color: var(--text-main);
      font-weight: 800;
      letter-spacing: .02em;
    }

    .text-section {
      position: absolute;
      top: 50%;
      left: 100px;
      transform: translateY(-50%);
      z-index: 4;
      max-width: 600px;
    }

    .divider {
      width: 72px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 3px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: {{ font_size }}px;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 20px;
      font-weight: 700;
    }

    p {
      font-size: 28px;
      color: var(--text-secondary);
      font-weight: 600;
    }

  </style>
</head>
<body>
  <div class="thumbnail">
    <img class="photo" src="{{ image_path }}" alt="">
    <div class="overlay"></div>
    
    <div class="logo-section">
      <img class="logo" src="C:/Users/Igreja em Contagem/Desktop/code/iec/templates/logo.png" alt="Logo">
    </div>

    <div class="text-section">
      <div class="divider"></div>
      <h1>{{ title }}</h1>
      <p>{{ speaker }}</p>
    </div>
  </div>
</body>
</html>
